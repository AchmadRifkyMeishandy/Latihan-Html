<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <form>
        Nama depan : <input type="text" name="" id=""><br>
        Nama Belakang : <input type="text" name="" id=""><br>
        Password : <input type="password"><br>
        <h4>WNI : radio button</h4>
        <input type="radio" name="WNI" value="ya"><label for="ya">ya</label><br>
        <input type="radio" name="WNI" value="tidak"><label for="tidak">tidak</label>

        <h4>Musik favorit : (Ceckbox)</h4>
        <input type="checkbox" name="musik" value="dangdut">
        <label for="dangdut">Dangdut</label><br><br>
        <input type="checkbox" name="musik" value="jazz">
        <label for="jazz">Jazz</label><br><br>

        <h4>Dropdown List</h4>
        <select name="pekerjaan">
            <option value="mahasiswa">Mahasiswa</option>
            <option value="wirausaha">Wirausaha</option>
        </select>

        <h4>Upload file</h4>
        <input type="file" name="foto" value="upload_foto">
        <br><br>
        <input type="button" name="submit" value="submit">
    </form>
    
</body>
</html>
