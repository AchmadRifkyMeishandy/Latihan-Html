<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Unordered list -->
    <h3>Unordered List</h3>
    <ul>
        <li>Masukkan spaghetti</li>
        <li>Masuukan air</li>
        <li>Masukkan donat</li>
        <ol>
            <li>Masukkan racun</li>
        </ol>
    </ul>

    <!-- Ordered list -->
    <h3>Oordered List</h3>
    <ol>
        <li>Masukkan air</li>
        <li>masukkan merica</li>
        <li>masukkan sasa</li>
        <ul>
            <li>Masukkan sendok</li>
        </ul>
    </ol>

    <!-- Definition list -->
     <h3>DL</h3>
    <dl>
        <dt>Masukkan merica</dt>
        <dt>masukkan madu</dt>
        <dd>masukkan garam</dd>
        <dd>masukkan kecap</dd>
    </dl>
</body>
</html>
