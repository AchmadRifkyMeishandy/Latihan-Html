    <title>Strong, Emphasis dan blockQuote</title>
    
</head>
<body>
    <!-- Strong -->
     <p><strong>Ini adalah shandy yang </strong> Sedang patah hati </p>

     <!-- Block Quote -->

      <!-- Emphasis -->

        tag q
       </q></p>
</body>
